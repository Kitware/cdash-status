name: Release
on:
  push:
    branches:
      - release

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: 24.2.3
          branches: release
          extra_plugins: |
            @semantic-release/changelog@b1044e17de7be4f0bf28c82b881b501e138a1b87
            @semantic-release/git@b39d5c6adcd2eb1f921481d8cbb3d605e629b56a
            @semantic-release/exec@a285bc576f59c5316bca5a7320dbf4255f952ff8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update major version tag
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAJOR: ${{ steps.semantic.outputs.new_release_major_version }}
          RELEASE_TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
        run: |
          sha="$(git rev-list -n1 "${RELEASE_TAG}")"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v${MAJOR}" -f sha="${sha}" -F force=true \
            || gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/v${MAJOR}" -f sha="${sha}"
