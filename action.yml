name: 'CDash Status'
description: 'Sets CDash status link for a GitHub commit'
branding:
  icon: box
  color: red
inputs:
  project:
    description: 'CDash project name (allowed characters: letters, digits, space, . _ -)'
    required: true
  github_token:
    description: 'GitHub token for API access (needs statuses: write)'
    required: false
    default: ${{ github.token }}
  base_url:
    description: 'CDash site base URL, http(s)://host[:port][/path] (allowed path characters: letters, digits, . _ ~ / -)'
    required: false
    default: https://open.cdash.org
  status_name:
    description: 'GitHub status check name (allowed characters: letters, digits, space, . _ : / -)'
    required: false
    default: cdash

runs:
  using: "composite"
  steps:
    - shell: bash
      if: ${{ github.event_name == 'pull_request_target' }}
      run: echo "COMMIT_SHA=${{ github.event.pull_request.head.sha }}" >> "${GITHUB_ENV}"

    - shell: bash
      if: ${{ github.event_name == 'push' }}
      run: echo "COMMIT_SHA=${{ github.sha }}" >> "${GITHUB_ENV}"

    - name: Run CDash status script
      shell: bash
      env:
        CDASH_BASE_URL: ${{ inputs.base_url }}
        CDASH_PROJECT: ${{ inputs.project }}
        GITHUB_STATUS_NAME: ${{ inputs.status_name }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: ${{ github.action_path }}/post-cdash-status
